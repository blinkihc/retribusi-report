# Netlify Configuration
# Frontend deployment untuk Retribusi Report

[build]
  command = "bun run build"
  publish = "dist"

# SPA redirect - semua routes ke index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (set di Netlify dashboard)
# VITE_API_URL = https://api.retribusi.example.com

# Headers untuk security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
